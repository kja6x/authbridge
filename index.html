<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Authenticator Import</title><script src="https://cdn.jsdelivr.net/npm/protobufjs@7.5.4/dist/protobuf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font:16px system-ui;background:#101827;color:#e5e7eb;max-width:850px;margin:30px auto;padding:0 16px}textarea{width:100%;box-sizing:border-box;min-height:90px;background:#1f2937;color:white;padding:12px;border:1px solid #64748b;border-radius:8px}button,input{margin:6px 5px 6px 0}button{padding:10px 14px;background:#2563eb;border:0;border-radius:7px;color:white;cursor:pointer}button:disabled{opacity:.5}video{width:100%;max-width:460px;border-radius:8px;display:none}.card{background:#1f2937;border:1px solid #374151;border-radius:9px;padding:15px;margin:12px 0}.code{font-size:30px;font-weight:bold;letter-spacing:3px}.secret{overflow-wrap:anywhere;font:13px monospace;color:#93c5fd}small{color:#aab5c5}.qr-panel{margin-top:12px;padding:14px;background:#111827;border-radius:8px}.qr-panel canvas,.qr-panel img{max-width:100%;height:auto}.qr-image{display:inline-block;padding:12px;background:white;border-radius:5px}.qr-panel p{font-size:13px;overflow-wrap:anywhere}.qr-panel a{color:#93c5fd}.error{color:#fca5a5}#scanCanvas{display:none}</style></head><body><h1>Authenticator QR Import</h1><p>Local-only QR decoding, standard authenticator QR export, and TOTP generation. Treat migration QR codes and exported secrets as passwords.</p><label for="uri">Migration URI or individual otpauth URI</label><textarea id="uri" placeholder="otpauth-migration://offline?data=..."></textarea><div><button id="parse">Import URI</button><button id="start">Start camera</button><button id="stop" disabled>Stop camera</button></div><video id="video" autoplay muted playsinline></video><canvas id="scanCanvas"></canvas><p><label for="upload">Upload QR image(s):</label> <input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" multiple></p><div><button id="export" disabled>Export JSON</button><button id="clear">Clear all</button></div><p id="status" role="status" aria-live="polite"></p><div id="accounts"></div><script>
'use strict';
const schema=`syntax="proto2";message MigrationPayload{repeated OTPParameters otp_parameters=1;optional int32 version=2;optional int32 batch_size=3;optional int32 batch_index=4;optional int32 batch_id=5;}message OTPParameters{optional bytes secret=1;optional string name=2;optional string issuer=3;enum Algorithm{ALGORITHM_UNSPECIFIED=0;ALGORITHM_SHA1=1;ALGORITHM_SHA256=2;ALGORITHM_SHA512=3;ALGORITHM_MD5=4;}optional Algorithm algorithm=4;enum DigitCount{DIGIT_COUNT_UNSPECIFIED=0;DIGIT_COUNT_SIX=1;DIGIT_COUNT_EIGHT=2;}optional DigitCount digits=5;enum OtpType{OTP_TYPE_UNSPECIFIED=0;OTP_TYPE_HOTP=1;OTP_TYPE_TOTP=2;}optional OtpType type=6;optional int64 counter=7;}`;
const Payload=protobuf.parse(schema).root.lookupType('MigrationPayload');const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';let accounts=[],batches=new Map(),stream=null,frameHandle=null,lastScan='',lastScanAt=0,renderGeneration=0;
const $=id=>document.getElementById(id);function status(msg,error=false){$('status').textContent=msg;$('status').className=error?'error':''}function base32(bytes){let out='',v=0,bits=0;for(const byte of bytes){v=(v<<8)|byte;bits+=8;while(bits>=5){out+=alphabet[(v>>>(bits-5))&31];bits-=5}v&=(1<<bits)-1}if(bits)out+=alphabet[(v<<(5-bits))&31];return out}function fromBase32(s){let v=0,bits=0,out=[];for(const c of s.toUpperCase().replace(/=+$/,'').replace(/\s/g,'')){const n=alphabet.indexOf(c);if(n<0)throw Error('Invalid Base32 secret');v=(v<<5)|n;bits+=5;if(bits>=8){out.push((v>>>(bits-8))&255);bits-=8;v&=(1<<bits)-1}}return new Uint8Array(out)}
function decodeURI(uri){const url=new URL(uri.trim());if(url.protocol==='otpauth-migration:'){const encoded=url.searchParams.get('data');if(!encoded)throw Error('Missing migration data');const normalized=encoded.replace(/ /g,'+').replace(/-/g,'+').replace(/_/g,'/');const raw=atob(normalized.padEnd(Math.ceil(normalized.length/4)*4,'='));const payload=Payload.decode(Uint8Array.from(raw,c=>c.charCodeAt(0)));const list=(payload.otpParameters||[]).map((p)=>{const algorithm=({0:'SHA-1',1:'SHA-1',2:'SHA-256',3:'SHA-512'})[p.algorithm??0];if(!algorithm)throw Error('Unsupported algorithm in QR');if(!p.secret?.length)throw Error('Account missing secret');if(p.type!==undefined&&![0,1,2].includes(p.type))throw Error('Unknown OTP type');if(p.digits!==undefined&&![0,1,2].includes(p.digits))throw Error('Unsupported digit count');return {issuer:p.issuer||'',name:p.name||'',secret:base32(p.secret),bytes:new Uint8Array(p.secret),algorithm,digits:p.digits===2?8:6,type:p.type===1?'HOTP':'TOTP',counter:p.counter?BigInt(p.counter.toString()):0n}});return {list,batchSize:payload.batchSize||1,batchIndex:payload.batchIndex||0,batchId:payload.batchId??0,version:payload.version??0};}
if(url.protocol==='otpauth:'){const type=url.hostname.toLowerCase();if(!['totp','hotp'].includes(type))throw Error('Unsupported OTP type');const secret=url.searchParams.get('secret');if(!secret)throw Error('Missing secret');const algorithm=({'SHA1':'SHA-1','SHA256':'SHA-256','SHA512':'SHA-512'})[(url.searchParams.get('algorithm')||'SHA1').toUpperCase()];if(!algorithm)throw Error('Unsupported algorithm');const digits=Number(url.searchParams.get('digits')||6);if(![6,8].includes(digits))throw Error('Unsupported digits');const label=decodeURIComponent(url.pathname.replace(/^\//,''));const counter=BigInt(url.searchParams.get('counter')||'0');return {list:[{issuer:url.searchParams.get('issuer')||label.split(':')[0]||'',name:label.includes(':')?label.split(':').slice(1).join(':'):label,secret:secret.toUpperCase().replace(/\s/g,''),bytes:fromBase32(secret),algorithm,digits,type:type.toUpperCase(),counter}],batchSize:1,batchIndex:0,batchId:0,version:0};}throw Error('QR is not a supported authenticator URI')}
function addURI(uri){const d=decodeURI(uri);if(d.batchSize>1){if(d.batchIndex<0||d.batchIndex>=d.batchSize)throw Error('Invalid migration batch index');const key=`${d.version}:${d.batchId}:${d.batchSize}`;if(!batches.has(key))batches.set(key,new Map());const group=batches.get(key);if(group.has(d.batchIndex)){status(`QR ${d.batchIndex+1}/${d.batchSize} already scanned`);return}group.set(d.batchIndex,d.list);if(group.size!==d.batchSize){status(`Scanned ${group.size} of ${d.batchSize} export QR codes. Scan the remaining codes.`);return}for(let i=0;i<d.batchSize;i++)mergeAccounts(group.get(i));batches.delete(key);status(`Imported all ${d.batchSize} QR batches. ${accounts.length} unique account(s).`)}else{mergeAccounts(d.list);status(`${accounts.length} unique account(s) imported.`)}render()}
function mergeAccounts(list){const existing=new Set(accounts.map(a=>`${a.type}|${a.issuer}|${a.name}|${a.secret}|${a.counter}`));for(const a of list){const k=`${a.type}|${a.issuer}|${a.name}|${a.secret}|${a.counter}`;if(!existing.has(k)){accounts.push(a);existing.add(k)}}}
async function otp(a,count){const key=await crypto.subtle.importKey('raw',a.bytes,{name:'HMAC',hash:a.algorithm},false,['sign']);const buf=new ArrayBuffer(8);new DataView(buf).setBigUint64(0,BigInt(count),false);const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));const off=sig[sig.length-1]&15;const n=((sig[off]&127)<<24)|((sig[off+1]&255)<<16)|((sig[off+2]&255)<<8)|(sig[off+3]&255);return String(n%(10**a.digits)).padStart(a.digits,'0')}
function otpAuthURI(a){
 const label=(a.issuer?a.issuer+':':'')+a.name;
 const u=new URL('otpauth://'+a.type.toLowerCase()+'/'+encodeURIComponent(label));
 u.searchParams.set('secret',a.secret);
 if(a.issuer)u.searchParams.set('issuer',a.issuer);
 u.searchParams.set('algorithm',a.algorithm.replace('-',''));
 u.searchParams.set('digits',String(a.digits));
 if(a.type==='HOTP')u.searchParams.set('counter',a.counter.toString());
 else u.searchParams.set('period','30');
 return u.toString();
}
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el}function render(){renderGeneration++;lastTick=-1;const root=$('accounts');root.replaceChildren();accounts.forEach((a,i)=>{const card=node('div',undefined,'card');card.append(node('strong',a.issuer||'Unknown issuer'),node('div',a.name));const code=node('div','…','code');code.id=`code-${i}`;card.append(code);const remaining=node('small','');remaining.id=`timer-${i}`;card.append(remaining,node('div',`${a.type} · ${a.algorithm} · ${a.digits} digits`));const secret=node('div',a.secret,'secret');card.append(secret);const copy=node('button','Copy code');copy.onclick=()=>navigator.clipboard.writeText(code.textContent).catch(e=>status(e.message,true));const copySecret=node('button','Copy secret');copySecret.onclick=()=>navigator.clipboard.writeText(a.secret).catch(e=>status(e.message,true));const showQR=node('button','Show authenticator QR');
 const qrPanel=node('div',undefined,'qr-panel');qrPanel.hidden=true;
 const warning=node('p','Anyone who scans this QR can generate your authentication codes. Keep it private.');
 const qrCanvas=node('div',undefined,'qr-image');
 const uriText=node('p','');
 const copyURI=node('button','Copy otpauth URI');
 copyURI.onclick=()=>navigator.clipboard.writeText(otpAuthURI(a)).catch(e=>status(e.message,true));
 const download=node('button','Download QR PNG');
 download.onclick=()=>{const canvas=qrCanvas.querySelector('canvas');const img=qrCanvas.querySelector('img');if(!canvas&&!img){status('Generate the QR code first',true);return}const link=document.createElement('a');link.download='authenticator-'+(i+1)+'.png';link.href=canvas?canvas.toDataURL('image/png'):img.src;link.click()};
 qrPanel.append(warning,qrCanvas,uriText,copyURI,download);
 showQR.onclick=async()=>{
   if(!qrPanel.hidden){qrPanel.hidden=true;showQR.textContent='Show authenticator QR';qrCanvas.replaceChildren();uriText.textContent='';return}
   try{
     if(!window.QRCode)throw Error('QR generation library unavailable');
     const uri=otpAuthURI(a);
     qrCanvas.replaceChildren();new QRCode(qrCanvas,{text:uri,width:280,height:280,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
     uriText.textContent='Standard otpauth URI: '+uri;
     qrPanel.hidden=false;showQR.textContent='Hide authenticator QR';
   }catch(e){status('Unable to generate QR: '+e.message,true)}
 };
 card.append(copy,copySecret,showQR,qrPanel);root.append(card)});$('export').disabled=!accounts.length;updateCodes()}
let lastTick=-1;async function updateCodes(){const gen=renderGeneration;const tick=Math.floor(Date.now()/30000);const remaining=30-Math.floor((Date.now()%30000)/1000);accounts.forEach((a,i)=>{const timer=$(`timer-${i}`);if(timer)timer.textContent=a.type==='HOTP'?`Counter ${a.counter}`:`Refresh in ${remaining}s`});if(lastTick===tick)return;lastTick=tick;await Promise.all(accounts.map(async(a,i)=>{try{const code=await otp(a,a.type==='HOTP'?a.counter:BigInt(tick));if(gen===renderGeneration&&$(`code-${i}`))$(`code-${i}`).textContent=code}catch(e){if(gen===renderGeneration&&$(`code-${i}`))$(`code-${i}`).textContent='Error: '+e.message}}))}
$('parse').onclick=()=>{try{addURI($('uri').value)}catch(e){status(e.message,true)}};
function decodeCanvas(canvas){const ctx=canvas.getContext('2d',{willReadFrequently:true});const image=ctx.getImageData(0,0,canvas.width,canvas.height);return jsQR(image.data,image.width,image.height,{inversionAttempts:'attemptBoth'})?.data||null}
async function importFile(file){if(!file.type.startsWith('image/'))throw Error('Select an image file');const bmp=await createImageBitmap(file);try{const canvas=$('scanCanvas');canvas.width=bmp.width;canvas.height=bmp.height;canvas.getContext('2d').drawImage(bmp,0,0);const uri=decodeCanvas(canvas);if(!uri)throw Error(`No readable QR found in ${file.name}`);addURI(uri)}finally{bmp.close()}}
$('upload').onchange=async e=>{for(const file of e.target.files){try{await importFile(file)}catch(err){status(err.message,true)}}e.target.value=''};
function stopCamera(){if(frameHandle)cancelAnimationFrame(frameHandle);frameHandle=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('video').style.display='none';$('start').disabled=false;$('stop').disabled=true}
async function scanFrame(){if(!stream)return;const video=$('video');if(video.readyState>=2&&video.videoWidth){const canvas=$('scanCanvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d',{willReadFrequently:true}).drawImage(video,0,0);const uri=decodeCanvas(canvas);if(uri&&(uri!==lastScan||Date.now()-lastScanAt>4000)){lastScan=uri;lastScanAt=Date.now();try{addURI(uri)}catch(e){status(e.message,true)}}}frameHandle=requestAnimationFrame(scanFrame)}
$('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera requires HTTPS or localhost');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();$('video').style.display='block';$('start').disabled=true;$('stop').disabled=false;status('Camera active. Point it at a QR code.');scanFrame()}catch(e){stopCamera();status(e.message,true)}};
$('stop').onclick=stopCamera;
$('export').onclick=()=>{const output=accounts.map(a=>({issuer:a.issuer,name:a.name,base32_secret:a.secret,algorithm:a.algorithm,digits:a.digits,type:a.type,...(a.type==='HOTP'?{counter:a.counter.toString()}:{})}));const blob=new Blob([JSON.stringify(output,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='authenticator-accounts.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('clear').onclick=()=>{stopCamera();accounts=[];batches.clear();lastScan='';renderGeneration++;lastTick=-1;$('uri').value='';$('accounts').replaceChildren();$('export').disabled=true;status('Cleared all accounts and pending QR batches.')};
setInterval(updateCodes,1000);if(!window.isSecureContext||!crypto.subtle)status('HTTPS or localhost is required for camera and TOTP generation.',true);
</script></body></html>
